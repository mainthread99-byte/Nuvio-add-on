name: Deploy to Render

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Render
        run: |
          if [ -z "${{ secrets.RENDER_API_KEY }}" ] || [ -z "${{ secrets.RENDER_SERVICE_ID }}" ]; then
            echo "Skipping deploy: missing RENDER_API_KEY or RENDER_SERVICE_ID"
            exit 0
          fi
          
          echo "Creating deploy..."
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Test scraper
        run: |
          if [ -z "${{ secrets.NUVIO_APP_URL }}" ] || [ -z "${{ secrets.NUVIO_TEST_URL }}" ]; then
            echo "Skipping test: missing NUVIO_APP_URL or NUVIO_TEST_URL"
            exit 0
          fi
          
          echo "Testing scraper..."
          sleep 30
          curl "${{ secrets.NUVIO_APP_URL }}/?action=stream&type=movie&id=${{ secrets.NUVIO_TEST_URL }}" -v || true
