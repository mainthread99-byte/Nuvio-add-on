name: Deploy to Render and test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP (optional)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Make script executable
        run: chmod +x ./scripts/deploy_and_test.sh

      - name: Deploy to Render and run test
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          APP_URL: ${{ secrets.NUVIO_APP_URL }}
          TEST_URL: ${{ secrets.NUVIO_TEST_URL }}
        run: |
          ./scripts/deploy_and_test.sh
